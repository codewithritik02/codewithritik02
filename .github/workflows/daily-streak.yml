name: Daily Streak Keeper

on:
  schedule:
    # Runs everyday at 00:05 UTC (05:35 AM IST)
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-streak
  cancel-in-progress: true

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update daily activity log
        run: |
          mkdir -p .github
          echo "Activity timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/daily-streak.txt

      - name: Commit and push daily streak
        run: |
          git config --global user.name "codewithritik02"
          git config --global user.email "ritiksainiritiksaini6@gmail.com"
          git pull --rebase --autostash
          git add .github/daily-streak.txt
          MESSAGES=(
            "👋 Hello World! wishing everyone happy coding"
            "☕ Coffee ➜ Code ➜ Repeat: keep building"
            "🙏 Namaste Coders: sending good vibes & clean code"
            "🚀 Ship it: one commit closer to greatness"
            "✨ Pushing pixels & building dreams"
            "💻 Talk is cheap, show me the code: happy coding"
            "🌟 Keep calm & git commit: another productive day"
          )
          DAY_OF_YEAR=$(date -u +'%j')
          INDEX=$(( 10#$DAY_OF_YEAR % ${#MESSAGES[@]} ))
          COMMIT_MSG="${MESSAGES[$INDEX]} • $(date -u +'%Y-%m-%d')"
          git commit -m "$COMMIT_MSG"
          git push origin main
