name: Daily Streak Keeper

on:
  schedule:
    # Runs everyday at 00:05 UTC (05:35 AM IST)
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-streak
  cancel-in-progress: true

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update daily activity log
        run: |
          mkdir -p .github
          echo "Activity timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/daily-streak.txt

      - name: Commit and push daily streak
        run: |
          git config --global user.name "codewithritik02"
          git config --global user.email "ritiksainiritiksaini6@gmail.com"
          git pull --rebase --autostash
          git add .github/daily-streak.txt
          MESSAGES=(
            "👋 Hello World! wishing everyone happy coding"
            "☕ Coffee ➜ Code ➜ Repeat: keep building"
            "🙏 Namaste Coders: sending good vibes & clean code"
            "🚀 Ship it: one commit closer to greatness"
            "✨ Pushing pixels & building dreams"
            "💻 Talk is cheap, show me the code: happy coding"
            "🌟 Keep calm & git commit: another productive day"
          )
          DESCRIPTIONS=(
            "Starting the day with positive energy and clean code. Wishing all fellow developers a productive day!"
            "Fueled by curiosity, caffeine, and dedication. Building innovative solutions one line at a time."
            "Respecting the journey and continuous learning. Sending warm greetings and positivity to the community!"
            "Consistency is key. Every small commit brings us closer to building something truly impactful."
            "Crafting smooth experiences, responsive UIs, and robust architectures. Passionate about web development."
            "Actions speak louder than words. Writing reliable, clean, and maintainable code every single day."
            "Staying focused, disciplined, and never breaking the chain. Keep moving forward!"
          )
          DAY_OF_YEAR=$(date -u +'%-j')
          YEAR=$(date -u +'%Y')
          DATE_STR=$(date -u +'%Y-%m-%d')
          INDEX=$(( 10#$DAY_OF_YEAR % ${#MESSAGES[@]} ))
          TITLE="${MESSAGES[$INDEX]} • Day ${DAY_OF_YEAR} of ${YEAR}"
          BODY="🗓️ Day ${DAY_OF_YEAR} of ${YEAR} • ${DATE_STR}
✨ ${DESCRIPTIONS[$INDEX]}
🚀 Automated daily streak check-in by GitHub Actions"
          git commit -m "$TITLE" -m "$BODY"
          git push origin main
